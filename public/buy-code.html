<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090f"><title>Buy a WiFi code</title>
<link rel="stylesheet" href="/site.css"><style>main{max-width:560px;margin:auto;padding:28px 16px 60px}h1{font-size:1.6rem;margin:.2rem 0 .3rem}.mut{color:var(--mut)}
.card{margin:12px 0}.plan{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%;text-align:left;cursor:pointer;margin:8px 0;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:#0a0d15;color:inherit;font:inherit}
.plan.on{border-color:var(--blue);background:rgba(106,168,255,.1)}.plan[disabled]{opacity:.5;cursor:not-allowed}.plan b{font-variant-numeric:tabular-nums}.plan small{display:block;color:var(--mut);font-weight:400}

<h1 id="ttl">Buy a WiFi code</h1><p class="mut" id="sub">Pick a plan, pay securely with Paystack and get your code straight away.</p>
<div id="view"></div></main>
<script src="/auth.js"></script>
<script>
var GW=null,plans=[],pick=null,view=document.getElementById("view"),KEY="sx_pending_code";
function el(t,a){var e=document.createElement(t);for(var k in a||{})if(k==="on")for(var v in a.on)e.addEventListener(v,a.on[v]);else if(k in e)e[k]=a[k];else e.setAttribute(k,a[k]);
 [].slice.call(arguments,2).forEach(function(c){if(c!=null)e.append(c)});return e}
function money(n){return"\u20A6"+Number(n||0).toLocaleString()}

function wr(v){try{v?localStorage.setItem(KEY,JSON.stringify(v)):localStorage.removeItem(KEY)}catch(e){}}

 view.append(el("div",{className:"card"},el("p",{className:"mut"},"Your code. Save it now: copy it or take a screenshot."),el("div",{id:"code"},r.code),
  el("button",{className:"go",on:{click:function(){try{navigator.clipboard.writeText(r.code);this.textContent="Copied"}catch(e){}}}},"Copy code"),
  el("p",{className:"mut"},"Connect to the WiFi and enter this code on the login page.")))}

 post({action:"claimStockCode",reference:ref}).then(function(r){
  if(r.ok)return showCode(r);
  if(r.error==="payment_not_verified"&&tries<3)return setTimeout(function(){claim(ref,tries+1)},3000);
  view.textContent="";view.append(el("div",{className:"card"},el("p",{className:"err"},r.message||"Could not confirm the payment."),el("p",{className:"mut"},"Reference: "+ref),
   el("button",{className:"alt",on:{click:function(){claim(ref,0)}}},"Check again"),el("button",{className:"alt",on:{click:function(){wr(null);home()}}},"Start over")))
 }).catch(function(){view.textContent="";view.append(el("div",{className:"card"},el("p",{className:"err"},"Could not reach the server. Your reference is "+ref+"."),el("button",{className:"alt",on:{click:function(){claim(ref,0)}}},"Check again")))})}
function pay(){if(!pick)return msg2("Choose a plan first.");if(!SX.isIn()){wr(null);location.href=SX.signInUrl("/buy-code.html?plan="+encodeURIComponent(pick.plan_id));return}
 var em=document.getElementById("em").value.trim(),ph=document.getElementById("ph").value.trim(),b=document.getElementById("pb");
 if(!pick)return msg2("Choose a plan first.");if(!/^\S+@\S+\.\S+$/.test(em))return msg2("Enter a valid email address. Paystack sends your receipt there.");
 var ref="CS-"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,8).toUpperCase();b.disabled=true;wr({ref:ref});
 var s=document.createElement("script");s.src="https://js.paystack.co/v2/inline.js";
 s.onload=function(){(new PaystackPop()).newTransaction({key:GW.public_key,email:em,amount:Math.round(pick.price*100),currency:"NGN",ref:ref,metadata:{stock_plan:pick.plan_id,phone:ph},
  onSuccess:function(){claim(ref)},onCancel:function(){b.disabled=false;if(rd())msg2("Payment window closed. If you already paid, press I have paid and get my code.")}})};
 s.onerror=function(){b.disabled=false;msg2("Could not load Paystack. Check your connection and try again.")};document.head.append(s)}
function msg2(t){var m=document.getElementById("m2");if(m){m.textContent=t;m.className="err"}}
function home(){view.textContent="";var p=rd();
 var list=el("div",{className:"card"});plans.forEach(function(x){list.append(el("button",{className:"plan"+(pick&&pick.plan_id===x.plan_id?" on":""),disabled:!x.in_stock,on:{click:function(){pick=x;home()}}},el("span",{},SX.name(x.name),el("small",{},[x.validity?SX.valid(x.validity):"",x.rate_limit?"up to "+SX.speed(x.rate_limit):"",x.in_stock?"":"sold out"].filter(Boolean).join(" \u00B7 "))),el("b",{},money(x.price))))});
 view.append(list,el("div",{className:"card"},el("input",{id:"em",type:"email",placeholder:"Email (for your receipt)",autocomplete:"email",value:(SX.user()||{}).email||""}),el("input",{id:"ph",type:"tel",placeholder:"Phone (optional)",autocomplete:"tel",value:(SX.user()||{}).phone||""}),
  el("button",{className:"go",id:"pb",on:{click:pay}},pick?(SX.isIn()?"Pay "+money(pick.price)+" with Paystack":"Sign in to pay "+money(pick.price)):"Choose a plan"),el("p",{id:"m2",className:"mut"},"")));
 if(p&&p.ref)view.append(el("button",{className:"alt",on:{click:function(){claim(p.ref,0)}}},"I have paid, get my code"))}
Promise.all([fetch("/api?action=getSettings").then(function(r){return r.json()}),fetch("/api?action=getStockPlans").then(function(r){return r.json()})]).then(function(a){
 GW=(a[0].gateways||{}).paystack;plans=a[1].plans||[];
 var qp=new URLSearchParams(location.search).get("plan");if(qp){var f=plans.filter(function(x){return x.plan_id===qp&&x.in_stock})[0];if(f)pick=f}
 var p=rd();if(!GW||!GW.enabled||!GW.public_key)return p&&p.ref?claim(p.ref,0):msg("Online payment is not switched on yet. Please contact support.");
 if(!plans.length)return p&&p.ref?claim(p.ref,0):msg("No plans are on sale right now. Please check back soon.");
 home()}).catch(function(){msg("Could not load plans. Check your connection and reload.","err")});
</script></body></html>
