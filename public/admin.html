<!-- cessprnet-admin -->
<style>

.shell{display:flex;min-height:100vh}

.tg:hover{background:rgba(255,255,255,.07);color:var(--ink)}.tg svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.scrim{display:none}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:0 0 16px}
.card>h2{display:flex;align-items:center;gap:8px}.card .sub{color:var(--mut);margin:-.2rem 0 .8rem;font-size:.88rem}

textarea{resize:vertical;font-family:inherit}select option{background:#0e1119}
input:focus,textarea:focus,select:focus,button:focus-visible,.ni:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:auto;margin:4px 8px 4px 0;padding:8px 15px;border-radius:9px;border:1px solid var(--line2);background:var(--surf2);color:var(--ink);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
button:hover,.btn:hover{background:#212840;border-color:#3a4562}
button.p,.btn.p{background:var(--blue);border-color:var(--blue);color:#06111f}button.p:hover{background:#8bbcff}
button.sm{padding:5px 11px;font-size:.84rem;margin:0 6px 0 0;border-radius:8px}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:block;color:var(--mut);font-size:.84rem;margin-top:12px}label input,label textarea,label select{color:var(--ink);margin-top:5px}
label.chk{display:flex;gap:9px;align-items:center;color:var(--ink);font-size:.92rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.scroll{overflow-x:auto;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin:0 0 16px}.card .scroll{border:0;background:none;margin:0}
table{border-collapse:collapse;width:100%;font-size:.87rem}th{color:var(--mut);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;background:rgba(255,255,255,.02)}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:rgba(255,255,255,.025)}
.s-requested{color:var(--warn)}.s-approved{color:var(--blue)}.s-activated,.s-new{color:var(--ok)}.s-rejected,.s-revoked,.s-revoking{color:var(--err)}.s-used{color:var(--mut)}
img.th{height:44px;width:120px;object-fit:cover;border-radius:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#0e1119;border:1px solid var(--line2);padding:11px 18px;border-radius:11px;z-index:99;box-shadow:0 8px 30px #0008;max-width:90vw}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}.kpi b{display:block;font:700 1.55rem ui-monospace,Menlo,Consolas,monospace;color:var(--ink);letter-spacing:-.02em}.kpi span{color:var(--mut);font-size:.8rem}
.codes{font:14px/1.7 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:240px;overflow:auto;white-space:pre-wrap}
pre.slip{font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;background:#fff;color:#000;border:1px dashed #999;border-radius:6px;padding:10px 12px;margin:0 0 16px;white-space:pre;page-break-after:always;break-after:page}pre.slip:last-child{page-break-after:auto;break-after:auto}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.fab{position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:24px;text-decoration:none;box-shadow:0 3px 14px #000a;z-index:15}
/* ---------- login ---------- */
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}.lg .card{width:100%;max-width:400px;padding:28px}.lg .logo{margin-bottom:14px;width:44px;height:44px}
/* ---------- router page ---------- */
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.big{display:flex;align-items:center;gap:12px;font-size:1.15rem;font-weight:700}.big i{width:14px;height:14px;border-radius:50%;background:var(--mut);box-shadow:0 0 0 5px rgba(139,148,174,.15)}

.step{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.step:first-of-type{border-top:0;padding-top:4px}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--surf2);border:1px solid var(--line2);color:var(--mut)}
.step.cur .num{background:var(--blue);border-color:var(--blue);color:#06111f}.step.done .num{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.5);color:var(--ok)}
.step h3{margin:.2rem 0 .3rem;font-size:.98rem;color:var(--ink);text-transform:none;letter-spacing:0}
.cmd{font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;background:#080a10;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;word-break:break-all;color:#cfe0ff;margin:8px 0}
.chk-l{list-style:none;margin:0;padding:0}.chk-l li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.chk-l li:first-child{border-top:0}
.chk-l .ic{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:800}
.ic.y{background:rgba(74,222,128,.16);color:var(--ok)}.ic.n{background:rgba(255,123,114,.16);color:var(--err)}.ic.w{background:rgba(251,191,36,.16);color:var(--warn)}
.chk-l small{display:block;color:var(--mut)}.chk-l .fx{color:var(--warn);font-size:.85rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line2);border-radius:99px;padding:3px 10px;color:var(--mut)}
.callout{border:1px solid var(--line2);border-left:3px solid var(--blue);background:rgba(106,168,255,.06);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.88rem}.callout.w{border-left-color:var(--warn);background:rgba(251,191,36,.06)}
.log{font:12px/1.7 ui-monospace,Menlo,Consolas,monospace;max-height:260px;overflow:auto;background:#080a10;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.log div{white-space:pre-wrap;word-break:break-all}
/* ---------- small screens ---------- */
@media(max-width:860px){

}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.card{border:0;background:none;padding:0}.codes{border:0;color:#000;background:#fff}.main{display:block}}

.brand>div{min-width:0}.brand b,.brand small{display:block!important}
