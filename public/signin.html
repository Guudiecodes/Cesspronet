<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060b">
<meta name="robots" content="noindex">
<title>Sign in · CessproNet</title>
<link rel="stylesheet" href="/account.css">
</head><body>
<header class="sx-top">
  <a class="sx-brand" href="/" aria-label="CessproNet home"><i>C</i><b>CESSPRO<span>NET</span></b></a>
</header>
<main class="sx-main">
  <h1 id="h">Sign in</h1>
  <p class="mut" id="sub">One account for buying plans and managing your codes.</p>
  <div class="note" id="why" hidden>
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    <span id="whyt"></span>
  </div>

  <section class="card" id="card" aria-live="polite">
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" id="t-in" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="t-up" aria-selected="false">Create account</button>
    </div>

    <!-- sign in -->
    <form id="f-in" novalidate>
      <label for="in-email">Email</label>
      <div class="fld"><svg class="l" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <input id="in-email" type="email" autocomplete="username" inputmode="email" placeholder="you@example.com" required></div>
      <label for="in-pw">Password</label>
      <div class="fld pw"><svg class="l" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="in-pw" type="password" autocomplete="current-password" placeholder="Your password" required>
        <button type="button" class="eye" data-eye="in-pw" aria-label="Show password"></button></div>
      <button class="btn" type="submit" id="b-in">Sign in</button>
      <div class="links"><button type="button" id="go-reset">Forgot password?</button><button type="button" id="go-staff">Staff? Email me a code</button></div>
    </form>

    <!-- create account -->
    <form id="f-up" novalidate hidden>
      <label for="up-name">Full name</label>
      <div class="fld"><svg class="l" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input id="up-name" autocomplete="name" placeholder="Your name" maxlength="60" required></div>
      <label for="up-email">Email</label>
      <div class="fld"><svg class="l" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <input id="up-email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required></div>
      <label for="up-phone">Phone <span class="mut" style="font-weight:400">(optional)</span></label>
      <div class="fld"><svg class="l" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <input id="up-phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="08031234567"></div>
      <label for="up-pw">Password</label>
      <div class="fld pw"><svg class="l" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="up-pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        <button type="button" class="eye" data-eye="up-pw" aria-label="Show password"></button></div>
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
      <p class="hint" id="pwhint">Use 8 or more characters.</p>
      <button class="btn" type="submit" id="b-up">Create account</button>
    </form>

    <!-- forgot password / staff code -->
    <form id="f-rs" novalidate hidden>
      <p class="mut" id="rs-intro" style="margin-top:0">Enter your email and we will send you a 6-digit code.</p>
      <label for="rs-email">Email</label>
      <div class="fld"><svg class="l" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <input id="rs-email" type="email" autocomplete="username" inputmode="email" placeholder="you@example.com" required></div>
      <div id="rs-step2" hidden>
        <label for="rs-code">6-digit code</label>
        <div class="fld"><svg class="l" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <input id="rs-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div>
        <label for="rs-pw">New password</label>
        <div class="fld pw"><svg class="l" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="rs-pw" type="password" autocomplete="new-password" placeholder="At least 8 characters">
          <button type="button" class="eye" data-eye="rs-pw" aria-label="Show password"></button></div>
      </div>
      <button class="btn" type="submit" id="b-rs">Send code</button>
      <div class="links"><button type="button" id="back-in">Back to sign in</button></div>
    </form>

    <p id="msg" role="status"></p>
  </section>
  <p class="mut" style="font-size:.88rem;text-align:center">Staff and customers sign in here. Staff accounts open the admin console; customer accounts open My account.</p>
</main>
<script src="/auth.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  var next = SX.safeNext(qs.get("next"));
  var mode = "in", step = 1, busy = false;
  var EYE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYEOFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';

  // why am I here?
  if (next) {
    var buying = /buy|checkout|plan|order/i.test(next);
    $("why").hidden = false;
    $("whyt").textContent = buying ? "Sign in or create a free account to finish your purchase. You will come straight back to it." : "Sign in to continue. You will be taken back to where you were.";
  }

  function msg(t, cls) { var m = $("msg"); m.textContent = t || ""; m.className = cls || ""; }
  function setMode(m, keepMsg) {
    mode = m;
    $("f-in").hidden = m !== "in"; $("f-up").hidden = m !== "up"; $("f-rs").hidden = m !== "rs";
    $("tabs").hidden = m === "rs";
    $("t-in").setAttribute("aria-selected", m === "in"); $("t-up").setAttribute("aria-selected", m === "up");
    $("h").textContent = m === "up" ? "Create your account" : m === "rs" ? "Reset your password" : "Sign in";
    $("sub").textContent = m === "up" ? "Free, takes under a minute. Your purchases and codes stay in one place." : m === "rs" ? "Staff signing in for the first time use this too." : "One account for buying plans and managing your codes.";
    if (!keepMsg) msg("");
    document.title = $("h").textContent + " · CessproNet";
    var first = m === "in" ? "in-email" : m === "up" ? "up-name" : "rs-email";
    setTimeout(function () { try { $(first).focus(); } catch (e) {} }, 0);
  }
  $("t-in").onclick = function () { setMode("in"); };
  $("t-up").onclick = function () { setMode("up"); };
  $("go-reset").onclick = function () { resetTo("Enter your email and we will send you a 6-digit code to choose a new password."); };
  $("go-staff").onclick = function () { resetTo("Staff: enter your staff email. We send a 6-digit code, then you choose a password."); };
  $("back-in").onclick = function () { step = 1; $("rs-step2").hidden = true; $("b-rs").textContent = "Send code"; $("rs-email").disabled = false; setMode("in"); };
  function resetTo(intro) { $("rs-intro").textContent = intro; $("rs-email").value = $("in-email").value; step = 1; $("rs-step2").hidden = true; $("b-rs").textContent = "Send code"; $("rs-email").disabled = false; setMode("rs"); }

  document.querySelectorAll("[data-eye]").forEach(function (b) {
    var inp = $(b.getAttribute("data-eye")); b.innerHTML = EYE;
    b.onclick = function () { var s = inp.type === "password"; inp.type = s ? "text" : "password"; b.innerHTML = s ? EYEOFF : EYE; b.setAttribute("aria-label", s ? "Hide password" : "Show password"); };
  });

  $("up-pw").addEventListener("input", function () {
    var v = this.value, s = 0; if (v.length >= 8) s++; if (v.length >= 12) s++; if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++; if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) s++;
    $("bar").style.width = (v ? 25 * Math.max(1, s) : 0) + "%"; $("bar").style.background = s < 2 ? "var(--err)" : s < 3 ? "var(--warn)" : "var(--ok)";
    $("pwhint").textContent = v.length < 8 ? "Use 8 or more characters." : s < 3 ? "Fine. Adding a longer phrase or numbers makes it stronger." : "Strong password.";
  });

  function lock(on, btn, label) { busy = on; btn.disabled = on; if (label) btn.textContent = on ? "Please wait…" : label; }

  function finish(r) {
    SX.save(r.token, r.user);
    var dest;
    if (r.user.role === "admin") dest = next && /^\/admin\.html/.test(next) ? next : "/admin.html";
    else dest = next && !/^\/admin\.html/.test(next) ? next : "/account.html";
    msg("Signed in. Taking you there…", "ok");
    location.replace(dest);
  }
  function fail(r) { msg(r.message || "Something went wrong. Try again.", "err"); }

  $("f-in").addEventListener("submit", function (e) {
    e.preventDefault(); if (busy) return;
    var em = $("in-email").value.trim(), pw = $("in-pw").value;
    if (!em || !pw) return msg("Enter your email and password.", "err");
    lock(true, $("b-in"), "Sign in"); msg("");
    SX.post("signIn", { email: em, password: pw }).then(function (r) { lock(false, $("b-in"), "Sign in"); r.ok ? finish(r) : fail(r); });
  });

  $("f-up").addEventListener("submit", function (e) {
    e.preventDefault(); if (busy) return;
    var d = { name: $("up-name").value.trim(), email: $("up-email").value.trim(), phone: $("up-phone").value.trim(), password: $("up-pw").value };
    if (!d.name) return msg("Enter your name.", "err");
    if (!/^\S+@\S+\.\S+$/.test(d.email)) return msg("Enter a valid email address.", "err");
    if (d.password.length < 8) return msg("Choose a password of at least 8 characters.", "err");
    lock(true, $("b-up"), "Create account"); msg("");
    SX.post("signUp", d).then(function (r) { lock(false, $("b-up"), "Create account"); r.ok ? finish(r) : fail(r); });
  });

  $("f-rs").addEventListener("submit", function (e) {
    e.preventDefault(); if (busy) return;
    var em = $("rs-email").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(em)) return msg("Enter a valid email address.", "err");
    if (step === 1) {
      lock(true, $("b-rs"), "Send code"); msg("");
      SX.post("forgotPassword", { email: em }).then(function (r) {
        lock(false, $("b-rs"), "Send code");
        if (!r.ok) return fail(r);
        step = 2; $("rs-step2").hidden = false; $("rs-email").disabled = true; $("b-rs").textContent = "Save password and sign in"; $("rs-code").focus();
        msg("If that email has an account, a code is on its way. It works for 15 minutes.", "ok");
      });
    } else {
      var code = $("rs-code").value.trim(), pw = $("rs-pw").value;
      if (!/^\d{6}$/.test(code)) return msg("Enter the 6-digit code.", "err");
      if (pw.length < 8) return msg("Choose a password of at least 8 characters.", "err");
      lock(true, $("b-rs"), "Save password and sign in"); msg("");
      SX.post("resetPassword", { email: em, code: code, password: pw }).then(function (r) { lock(false, $("b-rs"), "Save password and sign in"); r.ok ? finish(r) : fail(r); });
    }
  });

  // already signed in? check the session once, then continue
  if (SX.token()) {
    SX.post("accountMe", { token: SX.token() }).then(function (r) {
      if (r.ok) { SX.save(SX.token(), r.user); finish({ token: SX.token(), user: r.user }); } else SX.clear();
    });
  }
  setMode(qs.get("mode") === "signup" ? "up" : "in", true);
})();
</script>
</body></html>
